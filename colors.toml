# Core UI colors
accent = "#989898"                 # Neutral accent (derived from color4 / blue)
cursor = "#FFFFFF"                 # Kitty cursor color
foreground = "#DCDCDC"             # Primary text color
background = "#000000"             # Pure black background

selection_foreground = "#000000"   # Selected text
selection_background = "#FFFFFF"   # Selection background

# --------------------------------------------------
# Base16-aligned 16-color palette
# --------------------------------------------------

# base00–base07 (normal)
color0  = "#262626"  # base00 - Deep background
color1  = "#E08080"  # base08 - Error / critical
color2  = "#9DC48A"  # base0B - Success / positive
color3  = "#D5D09D"  # base0A - Warning / attention
color4  = "#9DB2CF"  # base0D - Primary accent
color5  = "#C9A3B6"  # base0E - Secondary accent
color6  = "#9EC4BE"  # base0C - Informational
color7  = "#DCDCDC"  # base05 - Default foreground

# base08–base0F (bright)
color8  = "#6E6E6E"  # base03 - Dim / inactive
color9  = "#EC9A9A"  # base08 - Bright error
color10 = "#B5D6A3"  # base0B - Bright success
color11 = "#E6E1B4"  # base0A - Bright warning
color12 = "#B6C7DE"  # base0D - Bright accent
color13 = "#DDBCCB"  # base0E - Bright secondary
color14 = "#B8D6D1"  # base0C - Bright info
color15 = "#FFFFFF"  # base07 - High-contrast text

