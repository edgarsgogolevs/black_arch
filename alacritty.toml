# ────────────────────────────────────────────────────────────
# Omarchy black_arch Theme for Alacritty - BlackWhite Warm palette
# Original theme by Ankur  https://github.com/ankur311sudo
# ────────────────────────────────────────────────────────────

[window]
# window padding {px}
padding.x = 20
padding.y = 20
decorations = "none"

[font]
size = 12.0


[colors.primary]
foreground = "#dcdcdc"
background = "#000000"
bright_foreground = "#ffffff"

[colors.selection]
text = "#000000"
background = "#ffffff"

[colors.cursor]
text = "#000000"
cursor = "#ffffff"

[colors.normal]
black   = "#262626"
red     = "#e08080"
green   = "#9dc48a"
yellow  = "#d5d09d"
blue    = "#9db2cf"
magenta = "#c9a3b6"
cyan    = "#9ec4be"
white   = "#dcdcdc"

[colors.bright]
black   = "#6e6e6e"
red     = "#ec9a9a"
green   = "#b5d6a3"
yellow  = "#e6e1b4"
blue    = "#b6c7de"
magenta = "#ddbccb"
cyan    = "#b8d6d1"
white   = "#ffffff"
